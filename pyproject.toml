[project]
name = "mcp-riot"
version = "0.2.0"
description = "MCP server for the Riot Games (League of Legends) API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0,<2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-riot = "mcp_riot.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_riot"]
